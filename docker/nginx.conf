upstream api {
    server api:3000;
}

upstream admin {
    server admin:80;
}

# HTTP: redirect to HTTPS, except ACME challenge
server {
    listen 80;
    server_name new-cur.foodloveapp.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name new-cur.foodloveapp.ru;

    ssl_certificate     /etc/letsencrypt/live/new-cur.foodloveapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new-cur.foodloveapp.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Socket.IO WebSocket — MUST be before /v1/ block (longer prefix wins)
    # nginx strips /v1/socket.io/ → forwards as /socket.io/ to api
    location /v1/socket.io/ {
        proxy_pass http://api/socket.io/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API — trailing slash on proxy_pass strips the /v1 prefix
    # e.g. /v1/auth/login → /auth/login on api:3000
    location /v1/ {
        proxy_pass http://api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Admin SPA — everything else
    location / {
        proxy_pass http://admin/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }
}
